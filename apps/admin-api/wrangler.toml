name = "admin-api-worker"
main = "src/index.ts"
compatibility_date = "2024-05-12"

[vars]
TEAM_DOMAIN = "https://aura-store.cloudflareaccess.com"
AUDIENCE_TAG = "your_audience_tag_here"

[[d1_databases]]
binding = "DB"
database_name = "ecommerce-db-prod"
database_id = "xxxx-xxxx-xxxx-xxxx"
preview_database_id = "local" # Dùng SQLite local khi chạy wrangler dev
migrations_dir = "../../packages/database/migrations"

[[r2_buckets]]
binding = "PRODUCTS_R2"
bucket_name = "products-bucket"
preview_bucket_name = "products-bucket-preview"

[[r2_buckets]]
binding = "CMS_R2"
bucket_name = "cms-bucket"
preview_bucket_name = "cms-bucket-preview"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "xxxx-xxxx-xxxx-xxxx"
preview_id = "local-cache-kv"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "ecommerce-events-prod"
