name = "admin-api-worker"
main = "src/index.ts"
compatibility_date = "2024-06-05"

[vars]
# Non-secret runtime config — secrets (STRIPE_SECRET_KEY) must be set via: wrangler secret put <KEY>
TEAM_DOMAIN = "https://tanhdev.cloudflareaccess.com"
AUDIENCE_TAG = "876ed9bd951b8a57e6144a5d7344a0999cafbb7f1a2dee69d833778bf6b26f0e"

[[d1_databases]]
binding = "DB"
database_name = "e-commerce"
database_id = "b41da4e0-7f8c-44db-8854-0499d5c2ced5"
preview_database_id = "local" # Dùng SQLite local khi chạy wrangler dev
migrations_dir = "../../packages/database/migrations"

[[r2_buckets]]
binding = "PRODUCTS_R2"
bucket_name = "e-commerce"
preview_bucket_name = "products-bucket-preview"

[[r2_buckets]]
binding = "CMS_R2"
bucket_name = "cms"
preview_bucket_name = "cms-bucket-preview"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "279b6209ce47468abc735e3f5c472be8"
preview_id = "local-cache-kv"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "ecommerce-events-prod"

[[queues.consumers]]
queue = "ecommerce-events-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 1
