name = "public-api-worker"
account_id = "c55319ae6f6801987a7ab8e1ac412856"
main = "src/index.ts"
compatibility_date = "2024-06-05"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

routes = [
  { pattern = "api-shop.tanhdev.com", custom_domain = true }
]

[vars]
# Non-secret runtime config — secrets (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY, JWT_SECRET, TURNSTILE_SECRET_KEY)
# must be set via: wrangler secret put <KEY> or Cloudflare environment secrets.
# Local development uses .dev.vars (e.g., TURNSTILE_SECRET_KEY="1x0000000000000000000000000000000AA").
STOREFRONT_URL = "https://aura-shop.tanhdev.com"

# RISK-01 FIX: CORS allowed origins — comma-separated list.
# Production: set to your real domain.
# Local origins (http://localhost:3000,http://localhost:5173) should be set in .dev.vars for local development.
ALLOWED_ORIGINS = "https://aura-shop.tanhdev.com"


[[d1_databases]]
binding = "DB"
database_name = "ecommerce-db"
database_id = "b41da4e0-7f8c-44db-8854-0499d5c2ced5"
preview_database_id = "local" # Dùng SQLite local khi chạy wrangler dev
migrations_dir = "../../packages/database/migrations"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "279b6209ce47468abc735e3f5c472be8"
preview_id = "local-cache-kv" # KV local

[[r2_buckets]]
binding = "PRODUCTS_R2"
bucket_name = "e-commerce"
preview_bucket_name = "products-bucket-preview"

[[r2_buckets]]
binding = "CMS_R2"
bucket_name = "cms"
preview_bucket_name = "cms-bucket-preview"

[[r2_buckets]]
binding = "SHIPPING_LABELS_R2"
bucket_name = "shipping-labels"
preview_bucket_name = "shipping-labels-preview"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "ecommerce-events-prod"

[[queues.producers]]
binding = "CART_RECOVERY_QUEUE"
queue = "cart-recovery-queue-prod"

[[queues.producers]]
binding = "STRIPE_WEBHOOK_QUEUE"
queue = "stripe-webhook-prod"

[[queues.producers]]
binding = "CARRIER_WEBHOOK_QUEUE"
queue = "carrier-webhook-prod"

[[queues.consumers]]
queue = "ecommerce-events-prod"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "ecommerce-events-dlq"

[[queues.consumers]]
queue = "stripe-webhook-prod"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "stripe-webhook-dlq"

[[queues.consumers]]
queue = "carrier-webhook-prod"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "carrier-webhook-dlq"

[triggers]
crons = ["*/5 * * * *", "0 * * * *", "0 0 * * *"] # Every 5 minutes (inventory), Hourly (abandoned), Daily (data tiering)

# Rate limiting bindings. period must be either 10 or 60 seconds.
# Each namespace_id is a separate counter; do not reuse an id across limits.
[[unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[[unsafe.bindings]]
name = "REVIEW_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "CHECKOUT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 12, period = 60 }

[[unsafe.bindings]]
name = "LEADS_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 10, period = 60 }

[[durable_objects.bindings]]
name = "INVENTORY_DO"
class_name = "InventoryLockManagerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InventoryLockManagerDO"]
