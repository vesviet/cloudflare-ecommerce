name = "public-api-worker"
main = "src/index.ts"
compatibility_date = "2024-06-05"
compatibility_flags = ["nodejs_compat"]

[vars]
# Non-secret runtime config — secrets (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY, JWT_SECRET)
# must be set via: wrangler secret put <KEY>
STOREFRONT_URL = "http://localhost:3000"

# RISK-01 FIX: CORS allowed origins — comma-separated list.
# Local dev: leave as-is (falls back to localhost:3000 and localhost:5173).
# Production: set to your real domain, e.g.:
#   ALLOWED_ORIGINS = "https://aura.store,https://www.aura.store"
# Or use a secret for sensitive configs: wrangler secret put ALLOWED_ORIGINS
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:5173"


[[d1_databases]]
binding = "DB"
database_name = "ecommerce-db-prod"
database_id = "xxxx-xxxx-xxxx-xxxx"
preview_database_id = "local" # Dùng SQLite local khi chạy wrangler dev
migrations_dir = "../../packages/database/migrations"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "xxxx-xxxx-xxxx-xxxx"
preview_id = "local-cache-kv" # KV local

[[r2_buckets]]
binding = "PRODUCTS_R2"
bucket_name = "products-bucket"
preview_bucket_name = "products-bucket-preview"

[[r2_buckets]]
binding = "CMS_R2"
bucket_name = "cms-bucket"
preview_bucket_name = "cms-bucket-preview"

[[queues.producers]]
binding = "EVENT_QUEUE"
queue = "ecommerce-events-prod"
