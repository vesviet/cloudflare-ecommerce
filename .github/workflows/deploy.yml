name: Deploy E-Commerce to Cloudflare

on:
  push:
    branches:
      - main
  # Optional: Allow manual trigger from the Actions tab
  workflow_dispatch:

# Optimization: Cancel in-progress builds if new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-workers:
    name: Build & Deploy API Workers
    # Use ubuntu-latest (1:1 billing ratio for GitHub Actions minutes)
    runs-on: ubuntu-latest
    environment: CLOUDFLARE
    
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 🔒 Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@bfa4b33a029b9aa80ddb784b45574c30e072c59e
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      # -- DEPLOY ADMIN API WORKER --
      - name: 🚀 Deploy Admin API (Worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter admin-api run deploy

      # -- DEPLOY PUBLIC API WORKER --
      - name: 🚀 Deploy Public API (Worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter public-api run deploy

  # (Optional) Deploy UI using Cloudflare Pages
  deploy-pages:
    name: Build & Deploy UI Pages
    runs-on: ubuntu-latest
    environment: CLOUDFLARE
    needs: deploy-workers # Remove this if you want UI and APIs to deploy concurrently
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Admin UI (Vite)
        env:
          VITE_API_URL: https://admin.tanhdev.com/api
        run: pnpm --filter admin-ui run build

      - name: 🚀 Deploy Admin UI (Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd apps/admin-ui && pnpm dlx wrangler@3 pages deploy dist --project-name ecommerce-admin-ui

      - name: 🏗️ Build Storefront UI (Next.js Edge)
        env:
          COREPACK_ENABLE_STRICT: "0"
        run: pnpm --filter storefront-ui run build:pages

      - name: 🚀 Deploy Storefront UI (Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/storefront-ui
          
          echo "Ensuring Pages project exists..."
          pnpm dlx wrangler@3 pages project create ecommerce-storefront-ui --production-branch main || true
          
          echo "Deploying to Pages..."
          pnpm dlx wrangler@3 pages deploy .vercel/output/static --project-name ecommerce-storefront-ui

      - name: 📦 Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'
