name: Generate OpenAPI SDKs

on:
  push:
    branches:
      - main
    paths:
      - 'packages/contract/src/**'
      - '.github/workflows/openapi-sdk.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-sdks:
    name: Generate Dart & Swift SDKs
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@99b8673bf64fbf146c43362d5eb1e33ae07c8727 # v4.2.2
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate OpenAPI JSON Spec
        run: |
          pnpm --filter @ecommerce/contract build:openapi
          echo "OpenAPI Spec generated at packages/contract/openapi.json"

      - name: Set up OpenAPI Generator CLI
        run: npm install -g @openapitools/openapi-generator-cli

      - name: Generate Dart SDK (Flutter)
        run: |
          mkdir -p ./sdks/dart
          openapi-generator-cli generate \
            -i ./packages/contract/openapi.json \
            -g dart \
            -o ./sdks/dart \
            --additional-properties=pubName=aura_api_sdk,pubVersion=1.0.0

      - name: Generate Swift SDK (iOS)
        run: |
          mkdir -p ./sdks/swift
          openapi-generator-cli generate \
            -i ./packages/contract/openapi.json \
            -g swift5 \
            -o ./sdks/swift \
            --additional-properties=projectName=AuraApiSDK

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: 'chore: auto-generate API SDKs from latest contracts'
          title: 'Automated SDK Update'
          body: 'This PR contains auto-generated SDKs reflecting the latest OpenAPI spec changes.'
          branch: 'auto/sdk-update'
          delete-branch: true
